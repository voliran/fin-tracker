
services:
  postgres:
    image: postgres:18
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata     
    container_name: postgres-db
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data/pgdata
