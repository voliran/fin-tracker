<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="fragments/layout :: head(${pageTitle})"></head>
<body>
<header th:replace="fragments/layout :: nav"></header>
<div th:replace="fragments/layout :: alerts"></div>
<main class="container py-4">
    <h1 class="h3 mb-4">Настройки профиля</h1>
    <div class="panel">
        <p class="text-muted" th:if="${user.registrationDate}">Дата регистрации: <span th:text="${user.registrationDate}"></span></p>
        <form th:action="@{/profile}" th:object="${form}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input class="form-control" th:field="*{name}" required th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" th:field="*{email}" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Ошибка</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Новый пароль (необязательно)</label>
                <input class="form-control" type="password" th:field="*{newPassword}" minlength="6"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Ошибка</div>
            </div>
            <button class="btn btn-primary" type="submit">Сохранить</button>
        </form>
    </div>
</main>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
