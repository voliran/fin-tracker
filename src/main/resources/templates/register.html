<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="fragments/layout :: head('Регистрация')"></head>
<body class="auth-body">
<main class="auth-card">
    <h1>Регистрация</h1>
    <form th:action="@{/register}" th:object="${form}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label class="form-label" for="name">Имя</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" th:field="*{name}" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="email" type="email" th:field="*{email}" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Ошибка</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Пароль</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" type="password" th:field="*{password}" required minlength="6">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Ошибка</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Создать аккаунт</button>
    </form>
    <p class="mt-3 mb-0"><a th:href="@{/login}">Назад ко входу</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
