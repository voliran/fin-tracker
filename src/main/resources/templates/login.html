<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="fragments/layout :: head('Вход')"></head>
<body class="auth-body">
<main class="auth-card">
    <img th:src="@{/images/logo.svg}" alt="FinTracker" width="48" height="48">
    <h1>FinTracker</h1>
    <p class="text-muted">Мониторинг доходов, расходов и отчётов</p>
    <div th:if="${param.error}" class="alert alert-danger">Неверный email или пароль</div>
    <div th:if="${param.logout}" class="alert alert-info">Вы вышли из системы</div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Пароль</label>
            <input class="form-control" id="password" name="password" type="password" required minlength="6">
        </div>
        <button class="btn btn-primary w-100" type="submit">Войти</button>
    </form>
    <p class="mt-3 mb-0">Нет аккаунта? <a th:href="@{/register}">Регистрация</a></p>
    <p class="small text-muted mt-3 mb-0">Демо: demo@globusit.local / demo123</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
